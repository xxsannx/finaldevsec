server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.php;

    # [10037] Sembunyikan informasi server (Sangat Penting)
    server_tokens off;
    proxy_hide_header X-Powered-By;
    fastcgi_hide_header X-Powered-By;

    # [10063] Menambahkan Permissions Policy
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # [90004] Proteksi Spectre (Site Isolation)
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # [10055] Perbaikan CSP Lengkap (Menghilangkan warning direktif fallback)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # Header Standar Lulus ZAP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # [10049] Kontrol Cache (Non-Storable Content)
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Sembunyikan X-Powered-By yang dikirim oleh PHP
        fastcgi_hide_header X-Powered-By;
    }

    # [10027] Mencegah akses ke file sensitif
    location ~ /\.(?!well-known).* {
        deny all;
    }
}